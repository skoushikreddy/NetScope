version: '3.8'

services:
  netscope:
    build: .
    container_name: netscope-scanner
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/applet/data
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
